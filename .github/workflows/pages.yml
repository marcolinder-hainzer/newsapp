# Holt alle 15 Minuten die neuesten Nachrichten, erstellt zweisprachige Zusammenfassungen und
# Briefings und veröffentlicht die App auf GitHub Pages (https://<benutzer>.github.io/<repository>/).
#
# Komplett kostenlos: GitHub Actions und GitHub Pages sind für öffentliche Repositories gratis,
# die Übersetzung DE <-> EN läuft mit freien Open-Source-Modellen (OPUS-MT) direkt in diesem Workflow.
#
# Einmalig einrichten: Settings → Pages → Source: "GitHub Actions"

name: Nachrichten aktualisieren

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # zum Aufräumen alter Datenstände im Zwischenspeicher

concurrency:
  group: weitblick-pages
  cancel-in-progress: false

jobs:
  update:
    # Nur auf dem Standard-Branch veröffentlichen
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATA_DIR: ${{ github.workspace }}/state
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      SCHEDULER_ENABLED: "false"
      REFRESH_INTERVAL_MINUTES: "15"
      RETENTION_DAYS: "8"
      # Höchstens so lange pro Lauf übersetzen; der Rest folgt im nächsten Lauf
      TRANSLATION_TIME_BUDGET_SECONDS: "420"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten installieren
        run: |
          pip install -r backend/requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-translate.txt

      - name: Übersetzungsmodelle laden (Zwischenspeicher)
        id: models
        uses: actions/cache/restore@v4
        with:
          path: .hf-cache
          key: opus-mt-de-en-v1

      - name: Letzten Datenstand laden
        uses: actions/cache/restore@v4
        with:
          path: state
          key: weitblick-state-${{ github.run_id }}
          restore-keys: weitblick-state-

      - name: Nachrichten abrufen, zusammenfassen, übersetzen und exportieren
        working-directory: backend
        run: python -m app.static_export --out ../site-data --compact-db

      - name: Datenstand speichern
        uses: actions/cache/save@v4
        with:
          path: state
          key: weitblick-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Übersetzungsmodelle speichern
        if: steps.models.outputs.cache-hit != 'true' && hashFiles('.hf-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .hf-cache
          key: opus-mt-de-en-v1

      - name: Alte Datenstände aufräumen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key weitblick-state- --sort created_at --order desc \
            --limit 100 --json key --jq '.[3:][].key' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true

      - name: GitHub Pages vorbereiten
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bauen
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm run build
          cp -r ../site-data dist/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
