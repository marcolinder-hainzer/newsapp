# Holt alle 15 Minuten die neuesten Nachrichten, erstellt Zusammenfassungen und Briefings
# und veröffentlicht die App auf GitHub Pages (https://<benutzer>.github.io/<repository>/).
#
# Einmalig einrichten (siehe README):
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → Secret ANTHROPIC_API_KEY anlegen
#   3. Optional unter "Variables": LLM_MODEL, LLM_DAILY_LIMIT, SUMMARIES_PER_CYCLE

name: Nachrichten aktualisieren

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # zum Aufräumen alter Datenstände im Zwischenspeicher

concurrency:
  group: weitblick-pages
  cancel-in-progress: false

jobs:
  update:
    # Nur auf dem Standard-Branch veröffentlichen
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATA_DIR: ${{ github.workspace }}/state
      SCHEDULER_ENABLED: "false"
      REFRESH_INTERVAL_MINUTES: "15"
      RETENTION_DAYS: "8"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5-5' }}
      LLM_EFFORT: ${{ vars.LLM_EFFORT || 'medium' }}
      LLM_DAILY_LIMIT: ${{ vars.LLM_DAILY_LIMIT || '200' }}
      SUMMARIES_PER_CYCLE: ${{ vars.SUMMARIES_PER_CYCLE || '20' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r backend/requirements.txt

      - name: Letzten Datenstand laden
        uses: actions/cache/restore@v4
        with:
          path: state
          key: weitblick-state-${{ github.run_id }}
          restore-keys: weitblick-state-

      - name: Nachrichten abrufen, zusammenfassen und exportieren
        working-directory: backend
        run: python -m app.static_export --out ../site-data --compact-db

      - name: Datenstand speichern
        uses: actions/cache/save@v4
        with:
          path: state
          key: weitblick-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Alte Datenstände aufräumen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key weitblick-state- --sort created_at --order desc \
            --limit 100 --json key --jq '.[3:][].key' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true

      - name: GitHub Pages vorbereiten
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bauen
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm run build
          cp -r ../site-data dist/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
