# Prüft die natürlichen Stimmen (Piper) in Chromium und WebKit (Safari-Engine).
name: Stimmen prüfen

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/public/piper-worker.js"
      - "frontend/src/audio/**"
      - "frontend/scripts/voice-check.mjs"
      - ".github/workflows/voice-check.yml"

permissions:
  contents: read

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten
        run: |
          npm ci
          npm run copy-vendor
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Stimmen prüfen
        run: node scripts/voice-check.mjs
