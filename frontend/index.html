<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Weitblick – aktuelle Nachrichten aus vielen Quellen, zweisprachig zusammengefasst, mit Vertrauens-Score und Vorlesefunktion." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Weitblick – Nachrichten mit Überblick</title>
    <script>
      // gespeichertes Aussehen sofort anwenden (kein Aufblitzen beim Start)
      try {
        var s = JSON.parse(localStorage.getItem("weitblick.settings.v1") || "{}"), r = document.documentElement;
        if (s.theme === "light" || s.theme === "dark") r.setAttribute("data-theme", s.theme);
        r.dataset.accent = s.accent || "blue";
        r.dataset.corners = s.corners || "round";
        r.dataset.card = s.cardStyle || "shadow";
        r.dataset.font = s.fontScale || "m";
        r.dataset.density = s.density || "normal";
        if (s.lang) r.lang = s.lang;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
